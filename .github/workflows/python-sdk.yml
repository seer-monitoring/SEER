name: Python SDK

on:
  push:
    branches: [main]
    paths:
      - "sdks/python/**"
      - ".github/workflows/python-sdk.yml"
    tags:
      - "seerpy-v*"
  pull_request:
    paths:
      - "sdks/python/**"
      - ".github/workflows/python-sdk.yml"

defaults:
  run:
    working-directory: sdks/python

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        run: pytest -q

  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/seerpy-v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdks/python/dist
          password: ${{ secrets.PYPI_API_TOKEN }}
