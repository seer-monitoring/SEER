[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seerpy"
version = "0.2.4"
description = "A lightweight monitoring and heartbeat client for Seer API"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "requests",
    "filelock",
]
authors = [
    { name = "SEER", email = "support@mg.ansrstudio.com" }
]
urls = { "Homepage" = "https://github.com/seer-monitoring/seer" }
license = "LicenseRef-Seer-4.2"
license-files = ["LICEN[CS]E*"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = ["pytest", "python-dotenv"]

[tool.setuptools.packages.find]
include = ["seerpy*"]
exclude = ["seerpy.failed_payloads*", "seerpy.test*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
